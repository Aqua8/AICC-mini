spring:
  application:
    name: aicc-backend

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.mariadb.jdbc.Driver
    hikari:
      maximum-pool-size: 20

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}  # 운영은 none 권장
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MariaDBDialect
        format_sql: true
        jdbc:
          batch_size: 1000
        order_inserts: true
        order_updates: true
    open-in-view: false
    show-sql: false

  batch:
    jdbc:
      initialize-schema: always
    job:
      enabled: false

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: 86400000

cors:
  # 쉼표로 여러 개. 배포 시 실제 프런트 주소로 바꾼다 (환경변수 CORS_ALLOWED_ORIGINS)
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

chat:
  auto-end:
    grace-seconds: 60      # 연결이 모두 끊긴 뒤 자동 종료까지 유예
    idle-minutes: 10        # 연결 없이 이 시간 동안 활동이 없으면 점검 때 종료

gemini:
  api-key: ${GEMINI_API_KEY:}
  model: gemini-3.5-flash-lite
  base-url: https://generativelanguage.googleapis.com

logging:
  level:
    org.springframework.batch: INFO
