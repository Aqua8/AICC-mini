spring:
  datasource:
    url: jdbc:h2:mem:aicc;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  batch:
    jdbc:
      initialize-schema: always
    job:
      enabled: false

jwt:
  secret: test-secret-key-that-is-long-enough-for-hmac-sha-256-algorithm-0123
  expiration-ms: 86400000

gemini:
  api-key: test-key
  model: gemini-1.5-flash
  base-url: https://generativelanguage.googleapis.com
